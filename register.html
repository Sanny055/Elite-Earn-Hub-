<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Elite Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#07111f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#0d1b2e;
  border:1px solid #24415e;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#2da8ff;
}

.subtitle{
  text-align:center;
  color:#8da3ba;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  color:#c9d9e8;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #294661;
  background:#081522;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#1687d9;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#1687d9;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.login{
  text-align:center;
  margin-top:18px;
  color:#8da3ba;
  font-size:13px;
}

.login a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

.note{
  margin-top:15px;
  text-align:center;
  color:#647b91;
  font-size:11px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ELITE <span>EARN HUB</span>
  </div>

  <div class="subtitle">
    Create your account and start earning Senax.
  </div>

  <form>

    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name">

    <label>Username</label>
    <input type="text" placeholder="Choose a username">

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Password</label>
    <input type="password" placeholder="Create a password">

    <label>Confirm Password</label>
    <input type="password" placeholder="Confirm your password">

    <label>Referral Code (Optional)</label>
    <input type="text" placeholder="Enter referral code">

    <button type="button">
      Create Account
    </button>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

  <div class="note">
    By creating an account, you agree to Elite Earn Hub terms.
  </div>

</div>

</body>
  </html>
