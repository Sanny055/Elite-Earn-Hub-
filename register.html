<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Elite Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#07111f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#0d1b2e;
  border:1px solid #24415e;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#2da8ff;
}

.subtitle{
  text-align:center;
  color:#8da3ba;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  color:#c9d9e8;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #294661;
  background:#081522;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#1687d9;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#1687d9;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  line-height:1.5;
  min-height:18px;
}

.login{
  text-align:center;
  margin-top:18px;
  color:#8da3ba;
  font-size:13px;
}

.login a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

.note{
  margin-top:15px;
  text-align:center;
  color:#647b91;
  font-size:11px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ELITE <span>EARN HUB</span>
  </div>

  <div class="subtitle">
    Create your account and start earning Senax.
  </div>

  <form id="registerForm">

    <label>Full Name</label>
    <input
      id="fullName"
      type="text"
      placeholder="Enter your full name"
      required
    >

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="Choose a username"
      required
    >

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Create a password"
      minlength="6"
      required
    >

    <label>Confirm Password</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm your password"
      minlength="6"
      required
    >

    <label>Referral Code (Optional)</label>
    <input
      id="referralCode"
      type="text"
      placeholder="Enter referral code"
    >

    <button id="registerBtn" type="submit">
      Create Account
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

  <div class="note">
    By creating an account, you agree to Elite Earn Hub terms.
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mpjpptzuvbcsadfrjqev.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_wtqfhJ1o9JG3LUvIcu2uaA_Ou8I4OV7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById("registerForm");

const button =
  document.getElementById("registerBtn");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(event){

  event.preventDefault();


  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const referralCode =
    document.getElementById("referralCode").value.trim();


  message.textContent = "";


  if(password !== confirmPassword){

    message.style.color = "#ff6b6b";

    message.textContent =
      "Passwords do not match.";

    return;

  }


  if(password.length < 6){

    message.style.color = "#ff6b6b";

    message.textContent =
      "Password must be at least 6 characters.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Creating Account...";


  try{

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            full_name: fullName,
            username: username,
            referral_code: referralCode
          }

        }

      });


    if(error){
      throw error;
    }


    message.style.color =
      "#4ade80";


    if(data.session){

      message.textContent =
        "Account created successfully! Redirecting to dashboard...";

      setTimeout(function(){

        window.location.href =
          "index.html";

      },1000);

    }else{

      message.textContent =
        "Account created! Please check your email for verification.";

      button.disabled = false;

      button.textContent =
        "Create Account";

      setTimeout(function(){

        window.location.href =
          "login.html";

      },2500);

    }


  }catch(error){

    message.style.color =
      "#ff6b6b";

    message.textContent =
      error.message || "Unable to create account.";

    button.disabled = false;

    button.textContent =
      "Create Account";

  }

});

</script>

</body>
</html>
