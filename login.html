<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Elite Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#07111f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#0d1b2e;
  border:1px solid #24415e;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#2da8ff;
}

.subtitle{
  text-align:center;
  color:#8da3ba;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:13px;
  color:#c9d9e8;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #294661;
  background:#081522;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#1687d9;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#1687d9;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.forgot{
  display:block;
  text-align:right;
  margin-top:10px;
  color:#38bdf8;
  font-size:12px;
  text-decoration:none;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#8da3ba;
  font-size:13px;
}

.register a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ELITE <span>EARN HUB</span>
  </div>

  <div class="subtitle">
    Login to your account
  </div>

  <form>

    <label>Email or Username</label>
    <input type="text" placeholder="Enter email or username">

    <label>Password</label>
    <input type="password" placeholder="Enter your password">

    <a href="#" class="forgot">Forgot Password?</a>

    <button type="button">
      Login
    </button>

  </form>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

</div>

</body>
</html>
