<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Elite Earn Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #0d1b2e;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #24415e;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8da3ba;
      margin-bottom: 25px;
      font-size: 13px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #294661;
      background: #081522;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1687d9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .register {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #8da3ba;
    }

    .register span {
      color: #38bdf8;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Elite Earn Hub</h1>

  <div class="subtitle">
    Login to your account
  </div>

  <form id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <div id="message"></div>

  <div class="register">
    Don't have an account?
    <span onclick="showRegister()">Register</span>
  </div>

</div>


<script>

  /* =========================
     SUPABASE
     ========================= */

  const SUPABASE_URL = "https://mpjpptzuvbcsadfrjqev.supabase.co";
  const SUPABASE_PUBLIC_KEY = "sb_publishable_wtqfhJ1o9JG3LUvIcu2uaA_Ou8I4OV7";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
  );


  /* =========================
     LOGIN
     ========================= */

  document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const loginBtn =
        document.getElementById("loginBtn");

      const message =
        document.getElementById("message");

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      message.textContent = "";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        message.textContent = error.message;
        message.style.color = "#ff6b7a";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

        return;
      }


      message.textContent =
        "Login successful. Opening Dashboard...";

      message.style.color = "#5ee68a";


      /* IMPORTANT:
         Dashboard file is now dashboard.html
      */

      setTimeout(function() {

        window.location.href = "dashboard.html";

      }, 500);

    }
  );


  /* =========================
     REGISTER
     ========================= */

  function showRegister() {

    alert("Registration page can be connected here.");

  }

</script>

</body>
</html>
