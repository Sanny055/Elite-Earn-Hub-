<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Elite Earn Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#07111f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#0d1b2e;
  border:1px solid #24415e;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#2da8ff;
}

.subtitle{
  text-align:center;
  color:#8da3ba;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:13px;
  color:#c9d9e8;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #294661;
  background:#081522;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#1687d9;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#1687d9;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  min-height:18px;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#8da3ba;
  font-size:13px;
}

.register a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ELITE <span>EARN HUB</span>
  </div>

  <div class="subtitle">
    Login to your account
  </div>

  <form id="loginForm">

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      required
    >

    <button id="loginBtn" type="submit">
      Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mpjpptzuvbcsadfrjqev.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_wtqfhJ1o9JG3LUvIcu2uaA_Ou8I4OV7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(event){

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  message.textContent = "";

  button.disabled = true;

  button.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if(error){ else {
  window.location.href = "index.html";
}

    message.style.color = "#ff6b6b";

    message.textContent =
      error.message;

    button.disabled = false;

    button.textContent = "Login";

    return;

  }


  message.style.color = "#4ade80";

  message.textContent =
    "Login successful!";

window.location.href = "index.html";
  setTimeout(function(){

    window.location.href =
      "index.html";

  },700);

});

</script>

</body>
  </html>
